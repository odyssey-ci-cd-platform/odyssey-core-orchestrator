---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only token; the job never pushes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # check-docs.sh (inside make check) diffs against origin/main.
          fetch-depth: 0
          persist-credentials: false # the job only reads; no pushes
      # actions/setup-go v5 — the dispatcher repo's ci.yml is the reference.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      # The single gate: docs check plus the Go gate with -race (AUD-011).
      - name: go gate
        run: make check
      # Pinned tool versions; `go run pkg@version` uses no third-party
      # action and runs the exact command that is verified locally (AUD-011).
      - name: lint
        run: |
          lint=github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go run "$lint" run ./...
      - name: vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
