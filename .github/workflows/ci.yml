---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # check-docs.sh diffs against origin/main
          persist-credentials: false # the job only reads; no pushes
      - name: docs check
        run: .agents/bin/check-docs.sh origin/main
      # When Go code lands, add actions/setup-go (go-version-file: go.mod)
      # and `make check` — the dispatcher repo's ci.yml is the reference.
