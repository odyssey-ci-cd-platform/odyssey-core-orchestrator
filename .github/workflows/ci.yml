---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # check-docs.sh diffs against origin/main
          persist-credentials: false # the job only reads; no pushes
      - name: docs check
        run: .agents/bin/check-docs.sh origin/main
      # actions/setup-go v5 — the dispatcher repo's ci.yml is the reference.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: go gate
        run: make check
